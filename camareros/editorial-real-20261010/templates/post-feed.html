<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><title>Somos Camareros | Edición documental</title>
<style>
*{box-sizing:border-box}
html,body{padding:0;margin:0;width:1080px;height:1920px;overflow:hidden}
body{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
.frame{position:relative;width:1080px;height:1920px;overflow:hidden;color:var(--ink);background:var(--paper);isolation:isolate}
.photo{position:absolute;inset:0;background-size:cover;background-position:50% 43%;transform:scale(1.01);z-index:0}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(1,19,23,.55),rgba(2,24,29,.03) 25%,rgba(2,24,29,.65) 54%,rgba(2,24,29,.9) 88%,rgba(2,24,29,.95));}
.topbar{position:absolute;z-index:2;top:90px;left:72px;right:72px;display:flex;align-items:center;justify-content:space-between;color:white}
.brand{font-size:30px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:13px}
.sigil{display:inline-flex;background:var(--accent);border-radius:50%;width:57px;height:57px;align-items:center;justify-content:center;color:#092932;font-weight:900;font-size:23px}
.series{font-size:21px;letter-spacing:2px;font-weight:800;opacity:.9}
.lead{z-index:2;position:absolute;left:73px;right:73px;top:410px;color:#fff}
.lead .eyebrow{font-size:31px;letter-spacing:3.8px;font-weight:900;color:var(--accent);margin:0 0 39px}
.lead .hero{font-size:108px;font-weight:900;letter-spacing:-5px;line-height:1.035;margin:0;white-space:pre-line;text-wrap:balance}
.lead .hero.small{font-size:93px}
.lead .detail{font-size:48px;font-weight:800;line-height:1.22;max-width:800px;margin-top:48px;letter-spacing:-.3px;color:#fff6e6}
.lead .underline{width:225px;height:14px;background:var(--accent);border-radius:10px;margin-top:45px}
.coverfooter{z-index:2;position:absolute;bottom:114px;left:73px;right:73px;border-top:2px solid #ffffff85;padding-top:31px;display:flex;justify-content:space-between;align-items:center;color:white;font-weight:800;letter-spacing:2.5px;font-size:27px}
.card-bg{position:absolute;inset:0;background:var(--paper)}
.storyphoto{position:absolute;top:0;left:0;right:0;height:950px;background-size:cover;background-position:50% 45%}
.storyphoto:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(2,20,26,.64),rgba(3,25,34,.08) 50%,rgba(3,25,34,.25) 78%,rgba(3,25,34,.58))}
.story-body{position:absolute;top:865px;left:0;right:0;bottom:0;border-radius:51px 51px 0 0;background:var(--paper);padding:77px 76px 57px;z-index:1}
.story-kicker{font-size:28px;font-weight:900;letter-spacing:3.6px;color:var(--pop);margin-bottom:23px}
.story-title{font-size:72px;font-weight:900;letter-spacing:-3.2px;line-height:1.06;white-space:pre-line;margin:0 0 34px;max-width:950px}
.story-title.sm{font-size:64px}
.statement{font-size:52px;font-weight:700;line-height:1.21;white-space:pre-line;margin-top:35px}
.detail-list{padding:0;margin:28px 0 0;list-style:none}
.detail-list li{display:flex;gap:21px;align-items:baseline;padding:17px 0;border-bottom:1px solid rgba(9,39,48,.16);font-size:46px;line-height:1.17;font-weight:740;letter-spacing:-1px}
.detail-list li:first-child{padding-top:5px}
.detail-list .num{font-size:26px;font-weight:900;flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:56px;width:56px;height:56px;background:var(--ink);color:var(--paper);border-radius:50%}
.story-bottom{position:absolute;bottom:53px;left:76px;right:76px;display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid rgba(9,39,48,.2);padding-top:26px;gap:40px}
.story-bottom small{font-size:24px;line-height:1.2;font-weight:700;opacity:.8;max-width:700px}
.story-bottom .count{color:var(--pop);font-size:27px;letter-spacing:2px;font-weight:900;flex:none}
.picturecaption{position:absolute;top:743px;left:70px;right:70px;z-index:1;color:#fff;font-weight:800;font-size:23px;letter-spacing:1.6px}

@media(max-height:1500px){
html,body,.frame{height:1440px}
.topbar{top:45px;left:65px;right:65px}
.brand{font-size:26px}
.sigil{width:49px;height:49px;font-size:20px}
.series{font-size:19px}
.lead{top:265px;left:65px;right:65px}
.lead .eyebrow{font-size:25px;letter-spacing:2.6px;margin-bottom:24px}
.lead .hero{font-size:94px;line-height:1.01;letter-spacing:-3.5px}
.lead .hero.small{font-size:78px}
.lead .underline{height:11px;width:185px;margin-top:29px}
.lead .detail{font-size:39px;margin-top:28px}
.coverfooter{left:65px;right:65px;bottom:51px;font-size:21px;padding-top:18px}
.storyphoto{height:700px}
.story-body{top:580px;border-radius:34px 34px 0 0;padding:53px 66px 35px}
.story-kicker{font-size:23px;letter-spacing:2.3px;margin-bottom:15px}
.story-title{font-size:62px;line-height:1.06;letter-spacing:-2px;margin-bottom:20px}
.story-title.sm{font-size:56px}
.statement{font-size:43px;line-height:1.2;margin-top:25px}
.detail-list{margin-top:20px}
.detail-list li{font-size:39px;letter-spacing:-.5px;padding:11px 0;gap:17px}
.detail-list .num{width:45px;height:45px;min-width:45px;font-size:22px}
.story-bottom{bottom:37px;left:66px;right:66px;padding-top:14px}
.story-bottom small{font-size:19px}
.story-bottom .count{font-size:22px}
.picturecaption{top:507px;left:65px;right:65px;font-size:18px}
}
</style></head><body><div id="root"></div>
<script>
const data={
rd:{
palette:['#f9f2e9','#102d35','#e46c3b','#ffe08e'],
photos:['service','order','coffee','outdoor'],
pages:[
{kind:'cover',eyebrow:'NUEVO · VIGENTE DESDE EL 5/10/2026',title:'¿CÓMO\nCALCULAN\nTU SUELDO?',detail:'Y cómo pueden cambiarte de turno.',sub:'Derechos laborales · España'},
{kind:'story',eyebrow:'LO QUE TIENES QUE SABER',title:'La empresa debe\ninformarte por escrito',bullets:['Salario base y complementos, por separado','Cálculo de pagos variables','Horario, cambios de turno y convenio'],source:'RD 723/2026 · arts. 2 y 3'},
{kind:'story',eyebrow:'¿YA ESTÁS CONTRATADO?',title:'Puedes pedir lo\nque te falte',bullets:['Para relaciones laborales de más de 4 semanas','Solicita por escrito los datos que no tengas','Plazo: 30 días hábiles desde la solicitud'],source:'RD 723/2026 · disp. transitoria'},
{kind:'story',eyebrow:'TEXTO PRÁCTICO PARA COPIAR',title:'Pídelo así',statement:'«Solicito por escrito la información que no figure en mi documentación sobre salario, jornada, cambios de turno y convenio aplicable».',source:'BOE-A-2026-19200 · guarda la fuente'}
]},
cierre:{
palette:['#f5f0e8','#112e35','#dd7948','#ffd28b'],
photos:['outdoor','bar','service','order'],
pages:[
{kind:'cover',eyebrow:'¿TRABAJAS EN HOSTELERÍA?',title:'EL BAR\nCIERRA A LAS 23.\nTÚ SALES A\nLAS 23:25.',detail:'¿Qué hora debe figurar en tu fichaje?',sub:'Problemas reales · Caso ilustrativo'},
{kind:'story',eyebrow:'DOS MOMENTOS DISTINTOS',title:'Cerrar al público\nno es salir del trabajo',bullets:['Hacer caja, limpiar y recoger son tareas laborales','El registro recoge inicio y final de jornada','Comprueba que refleja tu salida real'],source:'Estatuto de los Trabajadores · art. 34.9'},
{kind:'story',eyebrow:'LA SOLUCIÓN PRÁCTICA',title:'Haz esta comprobación',bullets:['Anota hora real de entrada y salida','Compara con tu registro de jornada','Pide por escrito corregir errores'],source:'ET · art. 34.9 · Registro 4 años'},
{kind:'story',eyebrow:'UNA DISTINCIÓN IMPORTANTE',title:'¿Son horas extra?',statement:'No necesariamente. Depende de tu jornada pactada, el cómputo de horas y el convenio. Que el registro sea correcto es el primer paso.',source:'ET · arts. 34 y 35'}
]},
descanso:{
palette:['#f7f0e5','#0f3035','#226c73','#f3c869'],
photos:['coffee','terrace','bar','service'],
pages:[
{kind:'cover',eyebrow:'HOSTELERÍA · JORNADA CONTINUADA',title:'¿MÁS DE\n6 HORAS\nSIN PARAR?',detail:'Hay una regla que conviene conocer.',sub:'Descansos reales · España'},
{kind:'story',eyebrow:'LA REGLA GENERAL',title:'Al menos\n15 minutos',statement:'Cuando la jornada diaria continuada supera las 6 horas, corresponde un descanso mínimo de 15 minutos.',source:'Estatuto de los Trabajadores · art. 34.4'},
{kind:'story',eyebrow:'PREGUNTA CLAVE',title:'¿Ese descanso\ncuenta como trabajo?',statement:'Depende: será tiempo de trabajo efectivo cuando lo establezca el convenio colectivo o tu contrato.',source:'Estatuto de los Trabajadores · art. 34.4'},
{kind:'story',eyebrow:'QUÉ HACER HOY',title:'Revisa estas 3 cosas',bullets:['Duración real de tu turno continuado','Pausa que figura en el cuadrante','Qué dice tu convenio sobre esa pausa'],source:'Fuente: BOE · ET 34.4'}
]},
doce:{
palette:['#f7f0e5','#122932','#db7046','#f8d273'],
photos:['terrace','order','outdoor','bar'],
pages:[
{kind:'cover',eyebrow:'ENTRE DOS JORNADAS',title:'SALES\nA LAS 00:30.\nENTRAS\nA LAS 08:00.',detail:'¿Cuánto descanso hay realmente?',sub:'Turnos de hostelería · España'},
{kind:'story',eyebrow:'HAZ LA CUENTA',title:'7 horas y media',statement:'Entre esos dos turnos hay 7 h 30 min. La regla general entre jornadas es un mínimo de 12 horas.',source:'Estatuto de los Trabajadores · art. 34.3'},
{kind:'story',eyebrow:'ANTES DE DECIDIR',title:'Comprueba el\nrégimen aplicable',bullets:['Revisa el cuadrante real de ambos días','Consulta convenio y posibles regímenes especiales','Solicita aclarar o corregir los turnos'],source:'ET · art. 34.3 · Ver jornadas especiales'},
{kind:'story',eyebrow:'DOCUMENTA SIN DISCUTIR',title:'Deja constancia',statement:'Guarda los horarios comunicados y anota tu salida y entrada reales. Ante dudas, consulta representación laboral o asesoramiento.',source:'Estatuto de los Trabajadores · art. 34'}
]}
};
const params=new URLSearchParams(location.search),topic=params.get('topic')||'rd',idx=Math.max(0,Math.min(3,+(params.get('frame')||0)));
const s=data[topic],page=s.pages[idx],photo=s.photos[idx],r=document.getElementById('root');document.documentElement.style.setProperty('--paper',s.palette[0]);document.documentElement.style.setProperty('--ink',s.palette[1]);document.documentElement.style.setProperty('--pop',s.palette[2]);document.documentElement.style.setProperty('--accent',s.palette[3]);
const photoURL='../photos/'+photo+'.jpg';
const brand='<span class="sigil">SC</span><span>SOMOS CAMAREROS</span>';
if(page.kind==='cover'){
r.innerHTML='<section class="frame"><div class="photo" style="background-image:url(\''+photoURL+'\')"></div><div class="topbar"><div class="brand">'+brand+'</div><div class="series">GUÍA '+(idx+1).toString().padStart(2,'0')+'/04</div></div><div class="lead"><p class="eyebrow">'+page.eyebrow+'</p><h1 class="hero '+(page.title.length>67?'small':'')+'">'+page.title+'</h1><div class="underline"></div><div class="detail">'+page.detail+'</div></div><div class="coverfooter"><span>'+page.sub+'</span><span>DESLIZA →</span></div></section>';
}else{
const list=page.bullets?'<ul class="detail-list">'+page.bullets.map((l,i)=>'<li><span class="num">'+(i+1)+'</span><span>'+l+'</span></li>').join('')+'</ul>':'<div class="statement">'+page.statement+'</div>';
r.innerHTML='<section class="frame"><div class="card-bg"></div><div class="storyphoto" style="background-image:url(\''+photoURL+'\')"></div><div class="topbar"><div class="brand">'+brand+'</div><div class="series">0'+(idx+1)+'/04</div></div><div class="picturecaption">FOTOGRAFÍA ILUSTRATIVA · CONTENIDO ORIGINAL</div><div class="story-body"><div class="story-kicker">'+page.eyebrow+'</div><h2 class="story-title '+(page.title.length>50?'sm':'')+'">'+page.title+'</h2>'+list+'<div class="story-bottom"><small>'+page.source+'<br/>Información general. Consulta tu convenio.</small><span class="count">0'+(idx+1)+'/04</span></div></div></section>';
}
</script></body></html>
